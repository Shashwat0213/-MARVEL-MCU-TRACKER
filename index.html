<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marvel Cinematic Universe Tracker</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#05070d;
    --bg2:#09111f;

    --card:#0d1422;
    --card2:#111b2f;

    --primary:#00e5ff;
    --secondary:#0077ff;

    --accent:#ff3d00;
    --gold:#ffd54a;

    --text:#ffffff;
    --muted:#9db4d1;

    --border:#18345b;

    --success:#00e676;

    --shadow:0 0 25px rgba(0,229,255,.20);
    --strong-shadow:0 0 35px rgba(0,229,255,.35);
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Orbitron",sans-serif;

    background:
        radial-gradient(
            circle at 50% -10%,
            #15345f 0%,
            var(--bg) 55%
        );

    color:var(--text);

    min-height:100vh;

    overflow-x:hidden;

    position:relative;
}

/* Animated futuristic grid */

body::before{
    content:"";

    position:fixed;

    inset:0;

    background-image:
        linear-gradient(
            rgba(0,229,255,.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,229,255,.035) 1px,
            transparent 1px
        );

    background-size:40px 40px;

    animation:gridMove 20s linear infinite;

    pointer-events:none;

    z-index:-2;
}

body::after{
    content:"";

    position:fixed;

    inset:0;

    background:
        radial-gradient(
            circle at center,
            transparent 20%,
            rgba(0,0,0,.35) 100%
        );

    pointer-events:none;

    z-index:-1;
}

@keyframes gridMove{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(40px);
    }
}


/* =========================================================
   CONTAINER
========================================================= */

.container{
    width:94%;

    max-width:1350px;

    margin:auto;

    padding:25px 0 40px;
}


/* =========================================================
   HEADER
========================================================= */

header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;

    margin-bottom:25px;

    flex-wrap:wrap;
}

.logo{
    display:flex;

    flex-direction:column;

    font-size:2rem;

    font-weight:800;

    letter-spacing:1px;

    color:var(--primary);

    text-shadow:
        0 0 10px var(--primary),
        0 0 25px rgba(0,229,255,.5);

    animation:logoGlow 2s infinite alternate;
}

.powered{
    margin-top:8px;

    font-size:.68rem;

    font-weight:700;

    letter-spacing:4px;

    text-transform:uppercase;

    color:var(--primary);

    text-shadow:
        0 0 5px var(--primary),
        0 0 15px var(--primary),
        0 0 30px var(--secondary);

    animation:poweredGlow 2s ease-in-out infinite alternate;
}

@keyframes logoGlow{

    from{
        text-shadow:
            0 0 10px var(--primary);
    }

    to{
        text-shadow:
            0 0 15px var(--primary),
            0 0 35px var(--primary),
            0 0 60px rgba(0,229,255,.5);
    }
}

@keyframes poweredGlow{

    from{
        opacity:.75;
    }

    to{
        opacity:1;
    }
}


/* =========================================================
   TOP BUTTONS
========================================================= */

.topbar{
    display:flex;

    gap:10px;

    flex-wrap:wrap;
}

button{
    border:none;

    outline:none;

    border-radius:12px;

    font-family:"Orbitron",sans-serif;

    cursor:pointer;

    transition:.25s ease;
}

.top-btn{
    padding:12px 17px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--secondary)
        );

    color:#fff;

    font-weight:700;

    box-shadow:var(--shadow);
}

.top-btn:hover{
    transform:translateY(-3px);

    box-shadow:
        0 0 20px rgba(0,229,255,.4),
        0 0 35px rgba(0,119,255,.25);
}


/* =========================================================
   MAIN PANEL
========================================================= */

.panel{
    background:
        linear-gradient(
            145deg,
            rgba(13,20,34,.94),
            rgba(8,16,29,.92)
        );

    backdrop-filter:blur(15px);

    border:1px solid var(--border);

    border-radius:22px;

    padding:22px;

    box-shadow:var(--strong-shadow);

    position:relative;

    overflow:hidden;
}

.panel::before{
    content:"";

    position:absolute;

    top:0;
    left:0;
    right:0;

    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--primary),
            transparent
        );

    box-shadow:0 0 15px var(--primary);
}


/* =========================================================
   SEARCH
========================================================= */

.search-box{
    position:relative;

    margin-bottom:20px;
}

.search-box input{
    width:100%;

    padding:16px 20px 16px 50px;

    background:var(--card);

    color:var(--text);

    border:1px solid var(--border);

    border-radius:14px;

    outline:none;

    font-family:"Orbitron",sans-serif;

    font-size:.9rem;

    box-shadow:var(--shadow);

    transition:.3s;
}

.search-box input::placeholder{
    color:#6f87a5;
}

.search-box input:focus{
    border-color:var(--primary);

    box-shadow:
        0 0 15px rgba(0,229,255,.25),
        0 0 30px rgba(0,229,255,.1);
}

.search-icon{
    position:absolute;

    left:18px;

    top:50%;

    transform:translateY(-50%);

    font-size:20px;

    pointer-events:none;
}


/* =========================================================
   STATS DASHBOARD
========================================================= */

.stats{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:14px;

    margin-bottom:22px;
}

.stat-card{
    background:
        linear-gradient(
            145deg,
            rgba(17,27,47,.95),
            rgba(9,17,31,.95)
        );

    border:1px solid var(--border);

    border-radius:16px;

    padding:17px;

    text-align:center;

    transition:.3s;

    position:relative;

    overflow:hidden;
}

.stat-card::before{
    content:"";

    position:absolute;

    width:70px;

    height:70px;

    background:rgba(0,229,255,.08);

    border-radius:50%;

    top:-35px;

    right:-35px;
}

.stat-card:hover{
    transform:translateY(-4px);

    border-color:var(--primary);

    box-shadow:var(--shadow);
}

.stat-icon{
    font-size:22px;

    margin-bottom:7px;
}

.stat-number{
    display:block;

    font-size:1.45rem;

    font-weight:800;

    color:var(--primary);

    margin-bottom:5px;
}

.stat-label{
    font-size:.65rem;

    color:var(--muted);

    letter-spacing:1px;

    text-transform:uppercase;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress-section{
    margin-bottom:22px;
}

.progress-header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:9px;

    gap:10px;
}

.progress-title{
    font-size:.8rem;

    color:var(--muted);

    letter-spacing:1px;
}

.progress-percent{
    color:var(--primary);

    font-weight:700;

    font-size:.8rem;
}

.progress{
    width:100%;

    height:15px;

    background:#17263e;

    border-radius:20px;

    overflow:hidden;

    border:1px solid #213a5e;
}

.progress-bar{
    width:0%;

    height:100%;

    background:
        linear-gradient(
            90deg,
            var(--primary),
            var(--secondary)
        );

    transition:.5s ease;

    box-shadow:
        0 0 15px var(--primary);

    display:flex;

    align-items:center;

    justify-content:center;
}


/* =========================================================
   FILTER BAR
========================================================= */

.filter-bar{
    display:flex;

    gap:10px;

    flex-wrap:wrap;

    margin-bottom:22px;
}

.filter-btn{
    padding:10px 14px;

    background:var(--card);

    color:var(--muted);

    border:1px solid var(--border);

    font-size:.7rem;

    font-weight:600;
}

.filter-btn:hover{
    color:#fff;

    border-color:var(--primary);
}

.filter-btn.active{
    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--secondary)
        );

    color:#fff;

    border-color:transparent;

    box-shadow:var(--shadow);
}


/* =========================================================
   SORT SELECT
========================================================= */

.sort-box{
    margin-left:auto;
}

.sort-box select{
    padding:10px 13px;

    border-radius:10px;

    border:1px solid var(--border);

    background:var(--card);

    color:var(--text);

    font-family:"Orbitron",sans-serif;

    font-size:.7rem;

    outline:none;

    cursor:pointer;
}


/* =========================================================
   MOVIE GRID
========================================================= */

.movie-list{
    list-style:none;

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(245px,1fr)
        );

    gap:18px;
}


/* =========================================================
   MOVIE CARD
========================================================= */

.movie-card{
    background:
        linear-gradient(
            145deg,
            rgba(13,20,34,.98),
            rgba(8,16,29,.98)
        );

    border:1px solid var(--border);

    border-radius:17px;

    overflow:hidden;

    position:relative;

    transition:.35s ease;

    box-shadow:
        0 8px 25px rgba(0,0,0,.25);
}

.movie-card:hover{
    transform:
        translateY(-8px)
        scale(1.015);

    border-color:var(--primary);

    box-shadow:
        0 0 25px rgba(0,229,255,.25),
        0 15px 35px rgba(0,0,0,.35);
}


/* =========================================================
   POSTER
========================================================= */

.poster-container{
    height:350px;

    position:relative;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #111b2f,
            #05070d
        );
}

.poster{
    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

    transition:.5s ease;
}

.movie-card:hover .poster{
    transform:scale(1.06);
}

.poster-overlay{
    position:absolute;

    inset:0;

    background:
        linear-gradient(
            to top,
            rgba(5,7,13,.95),
            transparent 55%
        );

    pointer-events:none;
}


/* =========================================================
   PHASE BADGE
========================================================= */

.phase-badge{
    position:absolute;

    top:12px;

    left:12px;

    padding:7px 10px;

    border-radius:8px;

    background:rgba(0,0,0,.72);

    backdrop-filter:blur(8px);

    border:1px solid rgba(0,229,255,.35);

    color:var(--primary);

    font-size:.62rem;

    font-weight:700;

    letter-spacing:.5px;

    z-index:2;
}


/* =========================================================
   FAVORITE BUTTON
========================================================= */

.favorite-btn{
    position:absolute;

    top:10px;

    right:10px;

    width:38px;

    height:38px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    background:rgba(0,0,0,.7);

    color:#fff;

    border:1px solid rgba(255,255,255,.15);

    font-size:18px;

    z-index:3;

    box-shadow:none;
}

.favorite-btn:hover{
    transform:scale(1.12);

    background:rgba(255,61,0,.8);
}

.favorite-btn.active{
    color:#ff3d00;

    text-shadow:
        0 0 10px #ff3d00;
}


/* =========================================================
   MOVIE INFORMATION
========================================================= */

.movie-info{
    padding:15px;
}

.movie-title{
    font-size:.9rem;

    line-height:1.45;

    min-height:42px;

    margin-bottom:12px;

    color:#fff;
}

.movie-meta{
    display:flex;

    flex-wrap:wrap;

    gap:7px;

    margin-bottom:13px;
}

.meta-item{
    padding:6px 8px;

    border-radius:7px;

    background:#101c30;

    border:1px solid #1c3557;

    color:var(--muted);

    font-size:.57rem;

    white-space:nowrap;
}

.rating{
    color:var(--gold);

    font-weight:700;
}


/* =========================================================
   WATCH BUTTON
========================================================= */

.watch-row{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;
}

.watch-label{
    display:flex;

    align-items:center;

    gap:8px;

    color:var(--muted);

    font-size:.62rem;

    cursor:pointer;
}

.watch-checkbox{
    width:17px;

    height:17px;

    accent-color:var(--primary);

    cursor:pointer;
}

.watched-text{
    color:var(--success);

    font-weight:700;
}


/* =========================================================
   PHASE SECTION
========================================================= */

.phase-section{
    margin-top:25px;

    margin-bottom:10px;
}

.phase-title{
    font-size:.85rem;

    color:var(--primary);

    margin-bottom:12px;

    letter-spacing:1px;
}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty-state{
    grid-column:1/-1;

    text-align:center;

    padding:50px 20px;

    color:var(--muted);

    border:1px dashed var(--border);

    border-radius:15px;

    background:rgba(13,20,34,.6);
}

.empty-icon{
    font-size:40px;

    margin-bottom:12px;
}


/* =========================================================
   RESET BUTTON
========================================================= */

.reset-btn{
    padding:11px 16px;

    background:
        linear-gradient(
            135deg,
            #ff3d00,
            #ff1744
        );

    color:#fff;

    font-weight:700;

    box-shadow:
        0 0 15px rgba(255,61,0,.2);
}

.reset-btn:hover{
    transform:translateY(-3px);

    box-shadow:
        0 0 25px rgba(255,61,0,.35);
}


/* =========================================================
   FOOTER
========================================================= */

footer{
    text-align:center;

    color:var(--muted);

    padding:25px 10px 5px;

    font-size:.65rem;

    letter-spacing:.5px;
}

.footer-highlight{
    color:var(--primary);

    font-weight:700;
}


/* =========================================================
   LIGHT THEME
========================================================= */

body.light-mode{
    --bg:#edf4ff;
    --bg2:#ffffff;

    --card:#ffffff;
    --card2:#f2f7ff;

    --text:#111827;
    --muted:#52627a;

    --border:#b9cee9;

    --shadow:0 0 20px rgba(0,100,200,.12);
    --strong-shadow:0 0 30px rgba(0,100,200,.16);
}

body.light-mode{
    background:
        radial-gradient(
            circle at top,
            #dceeff,
            #edf4ff 65%
        );
}

body.light-mode .movie-title{
    color:#111827;
}

body.light-mode .panel,
body.light-mode .movie-card,
body.light-mode .stat-card{
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.97),
            rgba(241,247,255,.97)
        );
}

body.light-mode .meta-item{
    background:#edf4ff;

    border-color:#c6d8ed;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1000px){

    .stats{
        grid-template-columns:
            repeat(2,1fr);
    }

    .poster-container{
        height:320px;
    }
}


@media(max-width:700px){

    .container{
        width:96%;

        padding-top:15px;
    }

    header{
        flex-direction:column;

        align-items:stretch;

        text-align:center;
    }

    .logo{
        align-items:center;

        font-size:1.5rem;
    }

    .topbar{
        justify-content:center;
    }

    .panel{
        padding:15px;
    }

    .stats{
        grid-template-columns:
            repeat(2,1fr);

        gap:10px;
    }

    .movie-list{
        grid-template-columns:1fr;
    }

    .poster-container{
        height:390px;
    }

    .filter-bar{
        flex-direction:column;
    }

    .sort-box{
        margin-left:0;

        width:100%;
    }

    .sort-box select{
        width:100%;
    }
}


@media(max-width:420px){

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .stat-card{
        padding:13px 8px;
    }

    .stat-number{
        font-size:1.15rem;
    }

    .poster-container{
        height:350px;
    }

    .top-btn{
        padding:10px 12px;

        font-size:.65rem;
    }
}

</style>
</head>

        ================================================== -->

            <div class="progress-header">

                <span

                    </option>

                    <option value="title">
                        Sort: Title
                    </option>

                    <option value="year">
                        Sort: Release Year
                    </option>

                    <option value="rating">
                        Sort: Rating
                    </option>

                    <option value="phase">
                        Sort: Phase
                    </option>

                </select>

            </div>

        </div>


        <!-- =================================================
             MOVIE LIST
        ================================================== -->

        <ul
            id="movieList"
            class="movie-list"
        >

            <!-- Movie cards will be generated by JavaScript -->

            <li class="empty-state">

                <div class="empty-icon">
                    🎬
                </div>

                <p>
                    Movie data will appear here.
                </p>

            </li>

        </ul>

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer>

        © 2026

        <span class="footer-highlight">
            Marvel Inspired MCU Tracker
        </span>

        — Powered by Shashwat

    </footer>

</div>

/* =========================================================
   PART 3 — FULL MCU TRACKER FUNCTIONALITY
========================================================= */


/* =========================================================
   ELEMENTS
========================================================= */

const movieList = document.getElementById("movieList");
const search = document.getElementById("search");

const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");

const totalMovies = document.getElementById("totalMovies");
const watchedMovies = document.getElementById("watchedMovies");
const remainingMovies = document.getElementById("remainingMovies");
const favoriteMovies = document.getElementById("favoriteMovies");

const themeBtn = document.getElementById("themeBtn");
const soundBtn = document.getElementById("soundBtn");
const resetBtn = document.getElementById("resetBtn");

const sortSelect = document.getElementById("sortSelect");

const filterButtons =
    document.querySelectorAll(".filter-btn");


/* =========================================================
   LOCAL STORAGE
========================================================= */

let watched =
    JSON.parse(
        localStorage.getItem("mcuWatched")
    ) || {};

let favorites =
    JSON.parse(
        localStorage.getItem("mcuFavorites")
    ) || {};

let soundEnabled =
    localStorage.getItem("mcuSound") !== "false";

let currentFilter = "all";

let currentSearch = "";

let currentSort = "default";


/* =========================================================
   SAVE DATA
========================================================= */

function saveData(){

    localStorage.setItem(
        "mcuWatched",
        JSON.stringify(watched)
    );

    localStorage.setItem(
        "mcuFavorites",
        JSON.stringify(favorites)
    );

    localStorage.setItem(
        "mcuSound",
        soundEnabled
    );
}


/* =========================================================
   SOUND EFFECTS
========================================================= */

function playSound(url, volume = 0.35){

    if(!soundEnabled) return;

    try{

        const audio = new Audio(url);

        audio.volume = volume;

        audio.play().catch(() => {});

    }catch(error){

        console.log("Sound unavailable");

    }

}


function playButtonSound(){

    playSound(
        "https://actions.google.com/sounds/v1/cartoon/pop.ogg",
        0.35
    );

}


function playTickSound(){

    playSound(
        "https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg",
        0.35
    );

}


function playThemeSound(){

    playSound(
        "https://actions.google.com/sounds/v1/science_fiction/laser_1.ogg",
        0.3
    );

}


/* =========================================================
   SAFE POSTER
========================================================= */

function posterFallback(image){

    image.onerror = function(){

        this.onerror = null;

        this.src =
            "https://placehold.co/500x750/0d1422/00e5ff?text=MARVEL+MOVIE";

    };

}


/* =========================================================
   GET MOVIES
========================================================= */

function getFilteredMovies(){

    let result = movies.map(
        (movie,index) => ({
            ...movie,
            originalIndex:index
        })
    );


    /* SEARCH */

    if(currentSearch){

        const query =
            currentSearch.toLowerCase().trim();

        result = result.filter(movie =>

            movie.title
                .toLowerCase()
                .includes(query)

        );

    }


    /* FILTER */

    if(currentFilter === "watched"){

        result = result.filter(
            movie => watched[movie.originalIndex]
        );

    }

    else if(currentFilter === "unwatched"){

        result = result.filter(
            movie => !watched[movie.originalIndex]
        );

    }

    else if(currentFilter === "favorites"){

        result = result.filter(
            movie => favorites[movie.originalIndex]
        );

    }


    /* SORT */

    if(currentSort === "title"){

        result.sort(
            (a,b) =>
                a.title.localeCompare(b.title)
        );

    }

    else if(currentSort === "year"){

        result.sort(
            (a,b) =>
                a.year - b.year
        );

    }

    else if(currentSort === "rating"){

        result.sort(
            (a,b) =>
                b.rating - a.rating
        );

    }

    else if(currentSort === "phase"){

        result.sort(
            (a,b) =>
                a.phase.localeCompare(b.phase)
        );

    }


    return result;

}


/* =========================================================
   RENDER MOVIES
========================================================= */

function renderMovies(){

    movieList.innerHTML = "";

    const filteredMovies =
        getFilteredMovies();


    /* EMPTY */

    if(filteredMovies.length === 0){

        movieList.innerHTML = `

            <li class="empty-state">

                <div class="empty-icon">
                    🔍
                </div>

                <p>
                    No movies found.
                </p>

            </li>

        `;

        updateStats();

        return;

    }


    /* MOVIE CARDS */

    filteredMovies.forEach(movie => {

        const index =
            movie.originalIndex;

        const isWatched =
            !!watched[index];

        const isFavorite =
            !!favorites[index];


        const li =
            document.createElement("li");

        li.className = "movie-card";


        /* POSTER */

        const posterContainer =
            document.createElement("div");

        posterContainer.className =
            "poster-container";


        const poster =
            document.createElement("img");

        poster.className = "poster";

        poster.src =
            movie.poster;

        poster.alt =
            movie.title + " poster";

        poster.loading = "lazy";

        posterFallback(poster);


        /* OVERLAY */

        const overlay =
            document.createElement("div");

        overlay.className =
            "poster-overlay";


        /* PHASE */

        const phase =
            document.createElement("div");

        phase.className =
            "phase-badge";

        phase.textContent =
            movie.phase;


        /* FAVORITE */

        const favorite =
            document.createElement("button");

        favorite.className =
            "favorite-btn";

        if(isFavorite){

            favorite.classList.add("active");

        }

        favorite.innerHTML =
            isFavorite ? "❤️" : "♡";

        favorite.title =
            "Add to favorites";


        favorite.addEventListener(
            "click",
            function(event){

                event.stopPropagation();

                favorites[index] =
                    !favorites[index];

                playButtonSound();

                saveData();

                renderMovies();

            }
        );


        posterContainer.appendChild(poster);

        posterContainer.appendChild(overlay);

        posterContainer.appendChild(phase);

        posterContainer.appendChild(favorite);


        /* INFO */

        const info =
            document.createElement("div");

        info.className =
            "movie-info";


        /* TITLE */

        const title =
            document.createElement("h2");

        title.className =
            "movie-title";

        title.textContent =
            movie.title;


        if(isWatched){

            title.style.textDecoration =
                "line-through";

            title.style.opacity =
                "0.6";

        }


        /* META */

        const meta =
            document.createElement("div");

        meta.className =
            "movie-meta";


        const year =
            document.createElement("span");

        year.className =
            "meta-item";

        year.textContent =
            "📅 " + movie.releaseDate;


        const rating =
            document.createElement("span");

        rating.className =
            "meta-item rating";

        if(movie.rating && movie.rating > 0){

            rating.textContent =
                "⭐ " +
                Number(movie.rating).toFixed(1);

        }else{

            rating.textContent =
                "⭐ TBA";

        }


        const phaseMeta =
            document.createElement("span");

        phaseMeta.className =
            "meta-item";

        phaseMeta.textContent =
            "⚡ " + movie.phase;


        meta.appendChild(year);

        meta.appendChild(rating);

        meta.appendChild(phaseMeta);


        /* WATCH ROW */

        const watchRow =
            document.createElement("div");

        watchRow.className =
            "watch-row";


        const watchLabel =
            document.createElement("label");

        watchLabel.className =
            "watch-label";


        const checkbox =
            document.createElement("input");

        checkbox.type =
            "checkbox";

        checkbox.className =
            "watch-checkbox";

        checkbox.checked =
            isWatched;


        const watchText =
            document.createElement("span");

        watchText.textContent =
            isWatched
                ? "Watched"
                : "Mark as watched";

        if(isWatched){

            watchText.classList.add(
                "watched-text"
            );

        }


        checkbox.addEventListener(
            "change",
            function(){

                watched[index] =
                    checkbox.checked;

                playTickSound();

                saveData();

                renderMovies();

            }
        );


        watchLabel.appendChild(checkbox);

        watchLabel.appendChild(watchText);


        /* FAVORITE STATUS */

        const favoriteText =
            document.createElement("span");

        favoriteText.className =
            "watch-label";

        favoriteText.textContent =
            isFavorite
                ? "❤️ Favorite"
                : "♡";


        watchRow.appendChild(watchLabel);

        watchRow.appendChild(favoriteText);


        /* BUILD */

        info.appendChild(title);

        info.appendChild(meta);

        info.appendChild(watchRow);


        li.appendChild(posterContainer);

        li.appendChild(info);


        movieList.appendChild(li);

    });


    updateStats();

}


/* =========================================================
   UPDATE STATISTICS
========================================================= */

function updateStats(){

    const total =
        movies.length;


    const completed =
        movies.filter(
            (_,index) =>
                !!watched[index]
        ).length;


    const favoritesCount =
        movies.filter(
            (_,index) =>
                !!favorites[index]
        ).length;


    const remaining =
        total - completed;


    const percent =
        total > 0
            ? Math.round(
                (completed / total) * 100
            )
            : 0;


    /* NUMBERS */

    totalMovies.textContent =
        total;

    watchedMovies.textContent =
        completed;

    remainingMovies.textContent =
        remaining;

    favoriteMovies.textContent =
        favoritesCount;


    /* PROGRESS */

    progressBar.style.width =
        percent + "%";


    progressText.textContent =
        `${completed}/${total} (${percent}%)`;

}


/* =========================================================
   SEARCH
========================================================= */

search.addEventListener(
    "input",
    function(){

        currentSearch =
            this.value;

        renderMovies();

    }
);


/* =========================================================
   FILTER BUTTONS
========================================================= */

filterButtons.forEach(
    button => {

        button.addEventListener(
            "click",
            function(){

                filterButtons.forEach(
                    btn =>
                        btn.classList.remove(
                            "active"
                        )
                );

                this.classList.add(
                    "active"
                );


                currentFilter =
                    this.dataset.filter;


                playButtonSound();

                renderMovies();

            }
        );

    }
);


/* =========================================================
   SORT
========================================================= */

sortSelect.addEventListener(
    "change",
    function(){

        currentSort =
            this.value;

        playButtonSound();

        renderMovies();

    }
);


/* =========================================================
   THEME
========================================================= */

function loadTheme(){

    const savedTheme =
        localStorage.getItem(
            "mcuTheme"
        );


    if(savedTheme === "light"){

        document.body.classList.add(
            "light-mode"
        );

        themeBtn.textContent =
            "🌙 Dark";

    }else{

        document.body.classList.remove(
            "light-mode"
        );

        themeBtn.textContent =
            "☀️ Light";

    }

}


themeBtn.addEventListener(
    "click",
    function(){

        playThemeSound();


        document.body.classList.toggle(
            "light-mode"
        );


        const isLight =
            document.body.classList.contains(
                "light-mode"
            );


        localStorage.setItem(
            "mcuTheme",
            isLight
                ? "light"
                : "dark"
        );


        themeBtn.textContent =
            isLight
                ? "🌙 Dark"
                : "☀️ Light";

    }
);


/* =========================================================
   SOUND BUTTON
========================================================= */

function updateSoundButton(){

    soundBtn.textContent =
        soundEnabled
            ? "🔊 Sound"
            : "🔇 Sound";

}


soundBtn.addEventListener(
    "click",
    function(){

        soundEnabled =
            !soundEnabled;

        saveData();

        updateSoundButton();

        if(soundEnabled){

            playButtonSound();

        }

    }
);


/* =========================================================
   RESET BUTTON
========================================================= */

resetBtn.addEventListener(
    "click",
    function(){

        const confirmed =
            confirm(
                "Are you sure you want to reset all watched and favorite movies?"
            );


        if(!confirmed){

            return;

        }


        watched = {};

        favorites = {};

        saveData();

        playButtonSound();

        renderMovies();

    }
);


/* =========================================================
   KEYBOARD SHORTCUT
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        /* "/" = focus search */

        if(
            event.key === "/" &&
            document.activeElement !== search
        ){

            event.preventDefault();

            search.focus();

        }


        /* Escape = clear search */

        if(
            event.key === "Escape"
        ){

            search.value = "";

            currentSearch = "";

            renderMovies();

            search.blur();

        }

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

loadTheme();

updateSoundButton();

renderMovies();

updateStats();


console.log(
    "⚡ Marvel MCU Tracker loaded successfully!"
);
</script>

</body>
</html>
